<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Diet Planner">
<meta name="theme-color" content="#1f2a24">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<title>Family Diet Planner</title>
<style>
:root{--bg:#f4f1ea;--card:#fffdf8;--ink:#1f2a24;--mut:#6b756e;--line:#ddd6c8;--acc:#2f6b4f;--acc2:#c8643a;--ok:#2f6b4f;--warn:#b7791f;--bad:#b3382c;--f:#c8643a;--p:#2f6b4f;--c:#3b6ea5}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 -apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif}
header{display:flex;flex-wrap:wrap;gap:12px;align-items:center;padding:14px 22px;background:var(--ink);color:#f4f1ea}
header h1{font-size:18px;margin:0;font-weight:600;letter-spacing:.2px}
header select,header button{font-size:14px;color:#1f2a24}
header .sp{flex:1}
nav{display:flex;gap:4px;padding:0 22px;background:var(--ink)}
nav button{background:none;border:0;color:#b9c2bb;padding:10px 16px;font-size:14px;border-radius:8px 8px 0 0;cursor:pointer}
nav button.on{background:var(--bg);color:var(--ink);font-weight:600}
main{max-width:1180px;margin:0 auto;padding:22px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px;margin-bottom:18px}
.card h2{font-size:16px;margin:0 0 12px}
.card h3{font-size:14px;margin:0;}
.grid{display:grid;gap:12px}
.g4{grid-template-columns:repeat(auto-fill,minmax(170px,1fr))}
.g2{grid-template-columns:repeat(auto-fit,minmax(380px,1fr));gap:18px}
label{display:block;font-size:12px;color:var(--mut);margin-bottom:3px}
input,select{width:100%;padding:7px 9px;border:1px solid var(--line);border-radius:7px;background:#fff;font:inherit;color:inherit}
input[type=number]{font-variant-numeric:tabular-nums}
button{padding:7px 12px;border:1px solid var(--line);border-radius:7px;background:#fff;font:inherit;color:inherit;cursor:pointer}
button:hover{border-color:var(--acc)}
button.pri{background:var(--acc);border-color:var(--acc);color:#fff}
button.sm{padding:3px 8px;font-size:13px}
button.ghost{border-color:transparent;background:none;color:var(--mut)}
button.act{background:var(--ink);color:#fff;border-color:var(--ink)}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th,td{padding:6px 8px;text-align:right;border-bottom:1px solid var(--line);font-size:14px}
th{font-size:12px;color:var(--mut);font-weight:500}
th:first-child,td:first-child{text-align:left}
.stat{background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.stat b{display:block;font-size:20px;font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--mut)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.mut{color:var(--mut);font-size:13px}
.meal{border:1px solid var(--line);border-radius:10px;padding:12px;background:#fff;margin-bottom:12px}
.meal .hd{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:6px}
.meal .hd h3{flex:1}
.item{display:grid;grid-template-columns:1fr 150px 66px 62px 140px 70px 156px;gap:8px;align-items:center;padding:4px 0;border-bottom:1px dashed var(--line)}
.item .mac{font-size:12px;color:var(--mut);text-align:right;font-variant-numeric:tabular-nums}
.pill{display:inline-block;padding:2px 8px;border-radius:99px;font-size:12px;font-variant-numeric:tabular-nums;background:#eee}
.under{background:#fff;color:var(--ink);border:1px solid var(--line)}.ok{background:#cfe8d8;color:#1d5a3c;border:1px solid #9fcfb3}.bad{border:1px solid #e0a79f}
.ok{background:#cfe8d8;color:#1d5a3c}.warn{background:#f6e7c8;color:var(--warn)}.bad{background:#f3d7d2;color:var(--bad)}
.bar{height:8px;border-radius:5px;background:#e9e3d6;overflow:hidden}
.bar i{display:block;height:100%}
.banner{background:#f6e7c8;border:1px solid #e3c98a;color:#6b4a08;padding:10px 14px;border-radius:10px;margin-bottom:16px}
.item.locked{background:#f3efe4}.item.locked input{border-color:var(--ink);font-weight:600}.lockon{color:var(--ink)!important;font-weight:700}
.item .kc{text-align:right;font-variant-numeric:tabular-nums;font-size:13px;white-space:nowrap}
.item .wt{text-align:right;font-variant-numeric:tabular-nums;font-weight:600;font-size:14px}
.meal.extra{border-style:dashed;background:#fbf8f0}.addgap{display:flex;justify-content:center;margin:-4px 0 8px}.addgap button{font-size:12px;color:var(--mut);border-style:dashed;padding:2px 10px}
.fill{border:1px solid var(--line);border-radius:9px;padding:8px 10px;margin-top:8px;background:#fff;font-size:13px}
.left{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.left div{border:1px solid var(--line);border-radius:9px;padding:6px 8px;background:#fff}.left b{display:block;font-size:17px;font-variant-numeric:tabular-nums}.left span{font-size:11px;color:var(--mut)}
.supp{display:grid;grid-template-columns:26px 1fr 110px 170px 128px 30px;gap:8px;align-items:center;padding:4px 0;border-bottom:1px dashed var(--line)}
.supp.done div{color:var(--mut);text-decoration:line-through}.supp input[type=checkbox]{width:18px;height:18px}
.like{color:var(--ok)}.dis{color:var(--bad)}
canvas{width:100%;height:260px;display:block}
.scroll{max-height:520px;overflow:auto}
.mp{display:inline-flex;gap:5px;align-items:center;white-space:nowrap}
.mstrip{display:none}
@media(max-width:760px){
  body{font-size:15px}
  header{padding:10px 12px;padding-top:calc(10px + env(safe-area-inset-top));gap:8px}header h1{font-size:16px}header label{display:none}
  nav{padding:0 8px;overflow-x:auto;white-space:nowrap;-webkit-overflow-scrolling:touch}nav button{padding:9px 11px;flex:none}
  main{padding:12px 10px calc(40px + env(safe-area-inset-bottom))}
  .card{padding:12px;overflow-x:auto}
  input,select,button{font-size:16px}button.sm{font-size:15px;padding:5px 9px}
  .g2{grid-template-columns:1fr}.g4{grid-template-columns:1fr 1fr}
  .plan-grid{grid-template-columns:1fr!important}.plan-side{position:static!important}
  .nfgrid{grid-template-columns:1fr 1fr!important}.nfgrid>div:nth-child(3){grid-column:1/-1}
  .meal{padding:10px}.meal .hd h3{flex-basis:100%}
  .item{grid-template-columns:1fr 64px 60px 70px;grid-template-areas:"name name name name" "unit qty wt kc" "mac mac btn btn";gap:6px;padding:8px 0}
  .item>div:first-child{grid-area:name;font-weight:600}.item>select{grid-area:unit}.item>input{grid-area:qty;padding:7px 4px;text-align:center}.item .wt{grid-area:wt}.item .kc{grid-area:kc}.item .mac{grid-area:mac;text-align:left}.item>.row{grid-area:btn;flex-wrap:nowrap}
  .supp{grid-template-columns:26px 1fr 1fr 30px;grid-template-areas:"chk name name rm" ". dose when when" ". time time .";gap:6px;padding:8px 0}
  .supp>input[type=checkbox]{grid-area:chk}.supp>div{grid-area:name;font-weight:600}.supp>input[data-sdose]{grid-area:dose}.supp>select{grid-area:when}.supp>input[type=time]{grid-area:time}.supp>button{grid-area:rm}
  .scroll table{min-width:860px}.scroll{max-height:none}
  .addgap button{font-size:13px}
  canvas{height:220px}
  .mstrip{display:flex;gap:6px;position:sticky;top:0;z-index:5;background:var(--ink);color:#f4f1ea;border-radius:10px;padding:8px 10px;margin-bottom:10px;font-size:13px;font-variant-numeric:tabular-nums;justify-content:space-between;flex-wrap:wrap}
  .mstrip b{font-size:15px}
}
</style>
</head>
<body>
<header>
  <h1>Family Diet Planner <span id="ver" style="font-weight:400;font-size:12px;color:#b9c2bb;margin-left:6px">version 18</span></h1>
  <span class="sp"></span>
  <label style="margin:0;color:#b9c2bb">Person</label>
  <select id="userSel" style="width:auto"></select>
  <button id="addUser">+ Add person</button>
</header>
<nav id="nav"></nav>
<main id="main"></main>

<script id="engine">
/* ===== Calculation engine: ported from Diet_Workout.xlsx (BASE FORM / FORMULAS / DIET NUMBERS) ===== */
const R=Math.round;
const ACT={Sedentary:1.3,Light:1.55,Moderate:1.65,Heavy:1.8,'Very Heavy':2};
const MEALS=[['B','Breakfast'],['S1','Snack 1'],['L','Lunch'],['S2','Snack 2'],['D','Dinner']];
const SPLIT={B:[20,10,30],S1:[10,20,10],L:[30,20,30],S2:[10,20,10],D:[30,30,20]}; // % of daily fat, protein, carbs
const GOALS={gain:'Gain weight: build muscle, lose fat',lose:'Lose weight: lose fat',maintain:'Maintain weight, lose fat'};
function macros(cal){const por=R(cal/6);return{cal,f:R(por/9),p:R(por/4*2),c:R(por/4*3)}}
function mealTargets(m){const o={};for(const k in SPLIT)o[k]={f:R(m.f/100*SPLIT[k][0]),p:R(m.p/100*SPLIT[k][1]),c:R(m.c/100*SPLIT[k][2])};return o}
function calc(u,bfFix){
  const lbs=R(u.weight*2.2),inch=R(u.height*0.39);
  const bmi=R(lbs/(inch*inch)*704.5*10)/10;
  const bmr=u.sex==='male'?R(66+13.7*u.weight+5*u.height-6.8*u.age):R(655+9.6*u.weight+1.8*u.height-4.7*u.age);
  const restBase=R(bmr*1.3),tdee=R(bmr*(ACT[u.activity]||1.3));
  const adj=2*(lbs/100*(100-(bfFix?u.bf:bmi)));
  const calW=u.goal==='gain'?R(tdee+adj):R(tdee-adj);
  const calR=u.goal==='lose'?R(restBase-adj):restBase;
  const mhr=220-u.age;
  const bmiCls=bmi<18.5?'Underweight':bmi<24.9?'Normal':bmi<29.9?'Overweight':bmi<34.9?'Obesity I':bmi<39.9?'Obesity II':'Extreme obesity';
  const W=macros(calW),Rm=macros(calR);
  return{lbs,inch,bmi,bmiCls,bmr,restBase,tdee,adj,mhr,
    trainHR:R((mhr-u.rhr)*0.7+u.rhr),zones:[60,70,80].map(z=>R(mhr/100*z)),
    fatKg:u.weight*u.bf/100,leanKg:u.weight*(100-u.bf)/100,
    workout:Object.assign(W,{meals:mealTargets(W)}),rest:Object.assign(Rm,{meals:mealTargets(Rm)})};
}
const kcalOf=x=>9*x.f+4*x.p+4*x.c;
function sumItems(items,foodById){const t={f:0,p:0,c:0};for(const it of items){const fd=foodById[it.id];if(!fd)continue;t.f+=fd.f*it.g/100;t.p+=fd.p*it.g/100;t.c+=fd.c*it.g/100}return t}
/* ----- food roles & limits ----- */
function role(fd){const k=kcalOf(fd)||1;if(fd.cat==='VEGGIE'&&k<60)return'veg';if(4*fd.p/k>=0.4)return'pro';if(9*fd.f/k>=0.5)return'fat';return'carb'}
const CATMAX={VEGGIE:300,FRUIT:250,DAIRY:350,'WHITE MEAT':300,'RED MEAT':250,FISH:300,VEGAN:250,EGG:250,CEREALS:100,BAKERY:120,PASTA:130,RICE:130,
  'PROTEIN POWDER':40,'PROTEIN BAR':70,'CEREAL BAR':50,'PROTEIN SHAKE':350,NUTS:40,SEEDS:30,CONDIMENTS:20,HONEY:30,'FRUIT JAM':30,SUGAR:15,CHEESE:80,CHOCOLATE:30,'COCOA POWDER':15};
function maxG(fd){const cap=role(fd)==='veg'?300:400;if(fd.usual)return Math.min(cap,Math.max(fd.usual*1.6,fd.usual+20));return CATMAX[fd.cat]||150}
function stepG(fd){return maxG(fd)<=40?1:5}
const MEALCATS={
  B:['DAIRY','CEREALS','BAKERY','FRUIT','PROTEIN POWDER','EGG','EGG WHITE','NUTS','SEEDS','HONEY','FRUIT JAM','PROTEIN SHAKE'],
  S:['DAIRY','FRUIT','PROTEIN BAR','CEREAL BAR','NUTS','PROTEIN POWDER','PROTEIN SHAKE','BAKERY','HONEY','FRUIT JAM','SEEDS'],
  M:['WHITE MEAT','RED MEAT','FISH','EGG','EGG WHITE','VEGAN','VEGGIE','PASTA','RICE','BAKERY','CHEESE','CONDIMENTS','DAIRY','NUTS','SEEDS']};
const mealGroup=m=>m==='B'?'B':(m==='L'||m==='D')?'M':'S';
/* ----- solver: bounded least squares on macro error, weighted in kcal (fat 9, protein 4, carbs 4) ----- */
function solve(fds,target,loA,hiA){
  const w=[9,4,4],t=[target.f,target.p,target.c],n=fds.length;
  const A=fds.map(fd=>[fd.f/100,fd.p/100,fd.c/100]);
  const lo=fds.map((fd,i)=>loA?loA[i]:0),hi=fds.map((fd,i)=>hiA?hiA[i]:maxG(fd));
  const x=fds.map((fd,i)=>Math.max(lo[i],Math.min(hi[i],(fd.usual||hi[i]/2)*0.5)));
  for(let it=0;it<300;it++){
    for(let i=0;i<n;i++){
      let num=0,den=0;
      for(let m=0;m<3;m++){let r=t[m];for(let j=0;j<n;j++)if(j!==i)r-=A[j][m]*x[j];num+=w[m]*w[m]*A[i][m]*r;den+=w[m]*w[m]*A[i][m]*A[i][m]}
      x[i]=den?Math.max(lo[i],Math.min(hi[i],num/den)):lo[i];
    }
  }
  const items=fds.map((fd,i)=>{const s=stepG(fd);return{id:fd.id,g:lo[i]===hi[i]?lo[i]:Math.max(Math.ceil(lo[i]/s)*s,R(x[i]/s)*s)}}).filter(it=>it.g>0);
  return items;
}
function errKcal(tot,target){return 9*Math.abs(tot.f-target.f)+4*Math.abs(tot.p-target.p)+4*Math.abs(tot.c-target.c)}
/* ----- taste score: explicit preference + learned history ----- */
function taste(u,fd,meal,hist){
  const pref=(u.prefs||{})[fd.id]||0; // -9 never, -2 dislike, 0 neutral, 2 like
  const h=(hist[meal]||{})[fd.id]||0, rej=(u.rejects||{})[fd.id]||0;
  let pop=0;if(fd.seed)for(const k in fd.seed)pop+=fd.seed[k]; // foods the household is known to buy
  return pref+Math.log(1+h)+0.4*Math.log(1+pop)-0.5*Math.log(1+rej);
}
function history(u,foods){ // seed from spreadsheet (if profile carries it) + everything this person has planned
  const h={};const add=(m,id,n)=>{(h[m]=h[m]||{})[id]=((h[m]||{})[id]||0)+n};
  if(u.seedHistory)for(const fd of foods)if(fd.seed)for(const m in fd.seed)add(m,fd.id,fd.seed[m]);
  for(const d in u.days||{})for(const m in u.days[d].meals)for(const it of u.days[d].meals[m])add(m,it.id,1);
  return h;
}
function pick(list,weights,rnd){let s=0;for(const w of weights)s+=w;let r=rnd()*s;for(let i=0;i<list.length;i++){r-=weights[i];if(r<=0)return list[i]}return list[list.length-1]}
/* ----- what a food is on the plate, so meals are built from things people eat together ----- */
function kind(fd){const n=String(fd.name).toUpperCase(),c=fd.cat;
  if(c==='PROTEIN BAR'||c==='CEREAL BAR')return'bar';
  if(c==='PROTEIN SHAKE')return'shake';
  if(c==='PROTEIN POWDER')return'powder';
  if(c==='HONEY'||c==='FRUIT JAM')return'sweet';
  if(c==='DAIRY'){if(/YOGURT DRINK|KEFIR/.test(n))return'milk';if(/YOGURT|YOGHURT|SKYR/.test(n))return'yogurt';if(/COTTAGE|RICOTTA|QUARK/.test(n))return'softcheese';return'milk'}
  if(c==='CHEESE')return'cheese';
  if(c==='FRUIT'){if(/SYRUP|PASTE/.test(n))return'sweet';if(/AVOCADO/.test(n))return'avocado';if(/COCONUT/.test(n))return'other';if(/RAISIN|DATES|PRUNES|DRIED/.test(n))return'dried';return'fruit'}
  if(c==='CEREALS')return'cereal';
  if(c==='BAKERY')return /FLOUR|CRUMBS/.test(n)?'other':/RUSK|CRACKER|STICKS|CAKES|THIN|TACO|BISCUIT/.test(n)?'crisp':'bread';
  if(c==='NUTS'||c==='SEEDS')return /BUTTER/.test(n)?'spread':/CHESTNUT/.test(n)?'other':'nuts';
  if(c==='EGG')return'egg';
  if(c==='WHITE MEAT'||c==='RED MEAT'||c==='FISH')return /SLICES|COLD CUT|BRESAOLA|CURED HAM|CANNED|SMOKED|IN BRINE/.test(n)?'coldcut':'meat';
  if(c==='VEGAN')return /HUMMUS/.test(n)?'spread':/CREAM/.test(n)?'other':'meat';
  if(c==='PASTA'||c==='RICE')return'starch';
  if(c==='VEGGIE'){if(/LETTUCE|TOMATO|ARUGULA|CUCUMBER|SALAD/.test(n))return'salad';return kcalOf(fd)<60?'veg':'starch'}
  if(c==='CONDIMENTS')return /OIL/.test(n)?'oil':'season'; // salt, vinegar, spices
  if(['CHOCOLATE','COCOA POWDER','SUGAR'].includes(c))return'other';
  const r=role(fd);return r==='pro'?'meat':r==='carb'?'starch':r==='veg'?'veg':'other'} // foods in a category the app does not know
const KB={yogurt:[125,400],softcheese:[80,250],milk:[150,400],fruit:[80,250],dried:[10,40],sweet:[10,30],cereal:[20,100],bread:[30,120],crisp:[15,80],nuts:[5,30],spread:[5,25],
  powder:[10,40],coldcut:[40,200],egg:[50,180],cheese:[20,80],salad:[30,120],meat:[80,300],starch:[30,300],veg:[80,300],oil:[3,20],avocado:[30,100]};
function bounds(fd,loose){const k=kind(fd);
  if(k==='bar'||k==='shake'){const g=parseFloat(fd.unitW)||fd.usual||(k==='bar'?50:330);return[g,g]} // a bar or a bottle is eaten whole
  if(k==='season'){const g=/SALT|PEPPER|SPICE/.test(String(fd.name).toUpperCase())?1:5;return[g,g]} // seasoning is a fixed pinch or teaspoon
  const b=KB[k]||[0,maxG(fd)];let lo=b[0],hi=b[1];if(fd.cat==='PASTA'||fd.cat==='RICE')hi=130;
  if(fd.usual&&fd.usual*1.2>hi)hi=fd.usual*1.2;if(loose)lo=lo*0.5;return[lo,hi]}
/* meal patterns: each slot is [kinds, probability] */
const PATTERNS={
  S:[{w:3,need:1,s:[[['yogurt','softcheese'],1],[['fruit'],.7],[['sweet'],.5],[['cereal','nuts','dried'],.35],[['powder'],.15]]}, // yogurt with fruit, jam, cereal
     {w:2,s:[[['yogurt'],1],[['bar'],1]]},                                                                                        // yogurt and a bar
     {w:3,s:[[['bread'],1],[['coldcut','egg','softcheese','cheese'],1],[['salad'],.5]]},                                          // sandwich
     {w:1,s:[[['milk'],1],[['powder'],1],[['fruit'],1],[['cereal'],.3]]},                                                         // shake / smoothie
     {w:1,s:[[['shake','bar'],1],[['fruit'],.8]]}],                                                                               // bar or ready shake with fruit
  B:[{w:4,s:[[['milk','yogurt'],1],[['cereal'],1],[['powder'],.5],[['fruit'],.4],[['nuts','dried'],.2],[['sweet'],.15]]},         // cereal bowl
     {w:2,s:[[['bread','crisp'],1],[['sweet','spread'],1],[['yogurt','milk'],1],[['fruit'],.3]]},                                         // toast with jam, plus yogurt or milk
     {w:1.5,s:[[['egg'],1],[['bread','crisp'],1],[['fruit'],.4],[['softcheese'],.3]]}],                                                   // eggs and bread
  M:[{w:6,s:[[['meat'],1],[['starch','bread','crisp'],1],[['veg','salad'],.9],[['oil'],.5],[['veg','salad'],.15]]},                       // meat or fish, a starch, vegetables
     {w:1,s:[[['egg'],1],[['starch','bread','crisp'],1],[['veg','salad'],.9],[['oil'],.3]]},
     {w:1,s:[[['bread'],1],[['coldcut','softcheese','cheese'],1],[['salad'],.8]]}]};
PATTERNS.S.push({w:1,s:[[['crisp'],1],[['softcheese','coldcut'],1],[['salad'],.3]]}); // crackers with cottage cheese or cold cuts
/* ----- household measures: grams for a teaspoon (5 ml), spoon (15 ml), glass (125 ml), handful or one piece. All are estimates. ----- */
const UNIT_ML={tsp:5,tbsp:15,glass:125};
const UNIT_NAME={tsp:'teaspoon',tbsp:'spoon',hand:'handful',glass:'glass 125 ml',pc:'piece'};
function density(fd){const n=String(fd.name).toUpperCase(),c=fd.cat,k=kind(fd); // g per ml, approximate
  if(k==='oil')return 0.92;if(c==='HONEY'||/SYRUP/.test(n))return 1.4;if(c==='FRUIT JAM'||/JAM|PASTE/.test(n))return 1.33;
  if(k==='milk'||k==='shake')return 1.03;if(k==='yogurt')return 1.03;if(k==='softcheese')return 0.95;if(k==='spread')return 1.07;
  if(k==='powder')return 0.43;if(c==='COCOA POWDER')return 0.36;if(c==='SUGAR')return 0.85;if(/SALT/.test(n)&&c==='CONDIMENTS')return 1.2;if(/FLOUR/.test(n))return 0.52;if(/CRUMBS/.test(n))return 0.45;if(/VINEGAR/.test(n))return 1.0;
  if(k==='cereal')return /OATS/.test(n)?0.34:/GRANOLA|MUESLI|GRITS/.test(n)?0.45:0.15;
  if(k==='nuts')return c==='SEEDS'?0.65:0.6;if(k==='dried')return 0.65;
  if(c==='RICE')return 0.8;if(c==='PASTA')return 0.42;

function today(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function fmtD(iso){return iso?iso.slice(8,10)+'/'+iso.slice(5,7)+'/'+iso.slice(2,4):''}
function parseD(str){const m=String(str).trim().match(/^(\d{1,2})[\/.\-](\d{1,2})[\/.\-](\d{2}|\d{4})$/);if(!m)return null;
  const d=+m[1],mo=+m[2],y=m[3].length===2?2000+ +m[3]:+m[3];const dt=new Date(y,mo-1,d);
  if(dt.getFullYear()!==y||dt.getMonth()!==mo-1||dt.getDate()!==d)return null;
  return y+'-'+String(mo).padStart(2,'0')+'-'+String(d).padStart(2,'0')}
function shiftD(iso,n){const [y,m,d]=iso.split('-').map(Number);const dt=new Date(y,m-1,d+n);return dt.getFullYear()+'-'+String(dt.getMonth()+1).padStart(2,'0')+'-'+String(dt.getDate()).padStart(2,'0')}
const WD=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];const wday=iso=>{const [y,m,d]=iso.split('-').map(Number);return WD[new Date(y,m-1,d).getDay()]};

function fixUser(u){ // plans live in u.daysPlan (u.days is the in-memory alias); repair profiles damaged by the old "workout days" field

function migrate(){ // v1 stored "CATEGORY - BRAND FOOD" in one field; v2 has category, brand and food separately
  if((S.v||1)<2){const seed={};for(const f of SEED_FOODS)seed[f.id]=f;
    for(const f of S.foods){const sd=seed[f.id];
      if(sd){f.cat=sd.cat;f.brand=sd.brand;f.name=sd.name;if(sd.unit)f.unit=sd.unit;if(sd.unitW)f.unitW=sd.unitW}
      else{f.brand=f.brand||'';if(f.name.indexOf(' - ')>0&&f.name.toUpperCase().startsWith(String(f.cat).toUpperCase()+' - '))f.name=f.name.slice(f.cat.length+3)}}
    S.v=2}
  if(S.v<3){const pm=S.foods.find(f=>f.id==='f056');if(pm&&pm.cat==='DAIRY')pm.cat='CHEESE';S.v=3}
  if(S.v<4){if(!S.foods.some(f=>f.id==='fsalt')){const sd=SEED_FOODS.find(f=>f.id==='fsalt');if(sd)S.foods.push(Object.assign({},sd))}S.v=4}
  if(S.v<5){const seed={};for(const f of SEED_FOODS)seed[f.id]=f;for(const f of S.foods){const sd=seed[f.id];if(sd&&sd.unitW&&!f.unitW){f.unit=sd.unit;f.unitW=sd.unitW}}S.v=5}
  if(S.v<6){S.v=6}
  if(!S.seedCombos||!Object.keys(S.seedCombos).length)S.seedCombos=SEED_COMBOS; // habits from the spreadsheet travel with the backup
  for(const f of S.foods)f.brand=f.brand||'';
}

function load(){

const CARRY=['B','S1','S2']; // breakfast and snacks repeat from the previous planned day
function carryMeal(k,type){const u=U();const dates=Object.keys(u.days).filter(d=>d<planDate&&(u.days[d].meals[k]||[]).length).sort();
  if(!dates.length)return null;const from=dates[dates.length-1],src=u.days[from];
  let items=src.meals[k].map(it=>{const o={id:it.id,g:it.g};if(it.lock)o.lock=1;if(it.u){o.u=it.u;o.n=it.n}return o});
  if(src.type!==type)items=fitItems(items,calc(u,S.bfFix)[type].meals[k]);
  return{items,from}}
function suggestion(type){const d={type,meals:{},carried:{}};for(const k of CARRY){const c=carryMeal(k,type);if(c){d.meals[k]=c.items;d.carried[k]=c.from}}return d}
function getDay(create){const u=U();let d=u.days[planDate];
  if(!d){d=suggestion('workout');if(create)u.days[planDate]=d;else d.virtual=true}
  d.carried=d.carried||{};return d}
function touch(d,k){if(d.carried)delete d.carried[k]}
/* a meal that is being cooked or dressed gets olive oil and salt (and vinegar with salad); returns true when something with calories was added */
function ensureCond(d,k){if(S.autoCond===false)return false;const fb=FB(),items=d.meals[k]||[],ks=items.map(it=>fb[it.id]?kind(fb[it.id]):'');
  const has=x=>ks.includes(x),bready=has('bread')||has('crisp');
  if(!(has('meat')||has('veg')||has('starch')||(has('salad')&&!bready)))return false;
  const no=((d.noCond=d.noCond||{})[k])||{},put=(fd,g,u,n)=>{if(!fd||no[fd.id]||items.some(it=>it.id===fd.id))return false;const it={id:fd.id,g,cond:1};if(u&&unitG(fd,u)){it.u=u;it.n=n;it.g=Math.round(n*unitG(fd,u))}items.push(it);return true};
  d.meals[k]=items;let cal=false;
  if(!has('oil')){const oils=S.foods.filter(f=>kind(f)==='oil');cal=put(oils.find(f=>/OLIVE/i.test(f.name))||oils[0],9,'tsp',2)}

  if(has('salad')&&!items.some(it=>fb[it.id]&&/VINEGAR/i.test(fb[it.id].name)))put(S.foods.find(f=>kind(f)==='season'&&/VINEGAR/i.test(f.name)),5,'tsp',1);

function fitItems(items,target){const fb=FB();const t={f:target.f,p:target.p,c:target.c};
  for(const it of items)if(it.lock){const fd=fb[it.id];if(fd){t.f-=fd.f*it.g/100;t.p-=fd.p*it.g/100;t.c-=fd.c*it.g/100}}
  // Fit grams never removes a food: every unlocked food keeps at least a small sensible amount, and a bar or ready shake keeps its amount
  const free=items.filter(it=>!it.lock&&fb[it.id]),fds=free.map(it=>fb[it.id]);
  const bd=fds.map((fd,i)=>{const k=kind(fd);if(k==='bar'||k==='shake'||k==='season')return[free[i].g,free[i].g];const b=bounds(fd,true);return[Math.max(b[0],stepG(fd)),Math.max(b[1],maxG(fd))]});
  const res=solve(fds,t,bd.map(b=>b[0]),bd.map(b=>b[1]));const g={};for(const r of res)g[r.id]=r.g;
  return items.map(it=>{if(it.lock||!fb[it.id])return it;const o={id:it.id,g:g[it.id]||it.g};if(it.u){o.u=it.u;snapUnit(o,fb[it.id])}return o})} // amounts in spoons, glasses... are fitted to the nearest half unit

/* Online lookup: Open Food Facts (branded products worldwide) and USDA FoodData Central (generic and US foods), asked in parallel */
async function fetchRetry(url,tries){let last;for(let i=0;i<tries;i++){try{const r=await fetch(url);if(r.status!==503&&r.status!==502)return r;last=new Error('busy')}catch(e){last=e}if(i<tries-1)await new Promise(ok=>setTimeout(ok,1500))}throw last}
async function searchOff(q){
  const r=await fetchRetry('https://world.openfoodfacts.org/cgi/search.pl?search_simple=1&action=process&json=1&page_size=15&fields=code,product_name,product_name_en,brands,quantity,nutriments&search_terms='+encodeURIComponent(q),2);
  if(!r.ok)throw new Error('Open Food Facts answered with error '+r.status+'.');
  return parseOff(await r.json())}
function parseOff(j){const num=v=>{const x=typeof v==='string'?parseFloat(v):v;return typeof x==='number'&&isFinite(x)?Math.round(x*10)/10:null};
  return ((j&&j.products)||[]).map(p=>{const n=p.nutriments||{};
    return{src:'Open Food Facts',name:String(p.product_name_en||p.product_name||'').trim(),brand:String(Array.isArray(p.brands)?p.brands[0]||'':p.brands||'').split(',')[0].trim(),type:p.quantity||'',
      f:num(n.fat_100g),p:num(n.proteins_100g),c:num(n.carbohydrates_100g),kcal:num(n['energy-kcal_100g'])}})
    .filter(r=>r.name&&r.f!=null&&r.p!=null&&r.c!=null)}
async function searchUsda(q){
  const r=await fetch('https://api.nal.usda.gov/fdc/v1/foods/search?api_key='+encodeURIComponent((S.usdaKey||'').trim()||'DEMO_KEY')+'&pageSize=10&query='+encodeURIComponent(q));
  if(r.status===429)throw new Error('USDA: the hourly limit of the shared demo key is used up (add a free key under "Online lookup settings").');
  if(r.status===403)throw new Error('USDA: the key was rejected. Check it under "Online lookup settings".');
  if(!r.ok)throw new Error('USDA answered with error '+r.status+'.');
  return parseUsda(await r.json())}
function parseUsda(j){
  return ((j&&j.foods)||[]).map(fd=>{const g=num=>{const n=(fd.foodNutrients||[]).find(x=>String(x.nutrientNumber)===num);return n&&typeof n.value==='number'?n.value:null};
    return{src:'USDA',name:fd.description||'',brand:fd.brandName||fd.brandOwner||'',type:fd.dataType||'',f:g('204'),p:g('203'),c:g('205'),kcal:g('208')}})
    .filter(r=>r.name&&(r.f!=null||r.p!=null||r.c!=null))}
async function lookupFood(q){
  q=(q||'').trim();if(!q){lk={status:'error',results:[],msg:'Type a food name first.'};render();return}
  lk={status:'loading',results:[],msg:''};render();
  const [off,usda]=await Promise.allSettled([searchOff(q),searchUsda(q)]);
  const results=[].concat(off.status==='fulfilled'?off.value:[],usda.status==='fulfilled'?usda.value:[]);
  const why=x=>x.reason instanceof TypeError||x.reason.message==='busy'?null:x.reason.message;
  const notes=[];
  if(off.status==='rejected')notes.push(why(off)||'Open Food Facts did not answer (it is often busy; try again in a minute).');
  if(usda.status==='rejected')notes.push(why(usda)||'USDA did not answer.');
  if(off.status==='rejected'&&usda.status==='rejected'&&!why(off)&&!why(usda))lk={status:'error',results:[],msg:'Could not reach the online services. Check the internet connection; everything else keeps working offline.'};
  else lk={status:'done',results,msg:notes.join(' ')};

}

    Generate tries these combinations first, checks them against the targets, and falls back to standard patterns (yogurt with fruit or jam, yogurt and a bar, a sandwich, a shake).</p></div>
  <div class="grid g2">${sec('Breakfast','B')}${sec('Snacks','S1')}${sec('Lunch','L')}${sec('Dinner','D')}</div>`}
/* ---------- Progress ---------- */
function vProgress(){const u=U();const ws=[...u.weights].sort((a,b)=>a.d<b.d?1:-1);
  return `<div class="card"><h2>Log a measurement</h2><div class="row"><div><label>Date (dd/mm/yy)</label><input type="text" id="wDate" value="${fmtD(today())}" style="width:110px"></div>
    <div><label>Weight (kg)</label><input type="number" step="any" id="wVal" value="${u.weight}"></div><div><label>Body fat (%) optional</label><input type="number" step="any" id="wBf"></div>
    <div><label>&nbsp;</label><button class="pri" id="wAdd">Save</button></div></div>
    <p class="mut" style="margin:10px 0 0">The newest measurement becomes the profile's current weight, so the calorie targets follow it.</p></div>
  <div class="grid g2"><div class="card"><h2>Weight (kg)</h2><canvas id="chW"></canvas></div><div class="card"><h2>Planned calories vs target</h2><canvas id="chK"></canvas></div></div>
  <div class="card"><h2>Measurements</h2>${ws.length?`<table><tr><th>Date</th><th>Weight kg</th><th>Body fat %</th><th></th></tr>${ws.map(w=>`<tr><td>${fmtD(w.d)}</td><td>${w.w}</td><td>${w.bf==null?'':w.bf}</td><td><button class="sm ghost" data-wdel="${w.d}">✕</button></td></tr>`).join('')}</table>`:'<p class="mut">No measurements yet.</p>'}</div>`;
}
function lineChart(cv,series,opts){opts=opts||{};const dpr=window.devicePixelRatio||1,W=cv.clientWidth,H=cv.clientHeight;cv.width=W*dpr;cv.height=H*dpr;const g=cv.getContext('2d');g.scale(dpr,dpr);
  g.font='12px -apple-system,Helvetica,Arial';const xs=[...new Set(series.flatMap(s=>s.pts.map(p=>p.x)))].sort();
  if(!xs.length){g.fillStyle='#6b756e';g.fillText(opts.empty||'No data yet',12,24);return}
  let ys=series.flatMap(s=>s.pts.map(p=>p.y));if(opts.hline!=null)ys.push(opts.hline);
  let lo=Math.min(...ys),hi=Math.max(...ys);if(hi-lo<1e-9){lo-=1;hi+=1}const pad=(hi-lo)*0.12;lo-=pad;hi+=pad;
  const L=48,Rr=14,T=22,B=28,X=x=>xs.length===1?L+(W-L-Rr)/2:L+(W-L-Rr)*xs.indexOf(x)/(xs.length-1),Y=y=>T+(H-T-B)*(1-(y-lo)/(hi-lo));
  g.strokeStyle='#e4ddcf';g.fillStyle='#6b756e';g.lineWidth=1;
  for(let i=0;i<=4;i++){const v=lo+(hi-lo)*i/4,y=Y(v);g.beginPath();g.moveTo(L,y);g.lineTo(W-Rr,y);g.stroke();g.textAlign='right';g.fillText(opts.dec?v.toFixed(1):Math.round(v),L-6,y+4)}
  g.textAlign='center';const stepX=Math.max(1,Math.ceil(xs.length/6));xs.forEach((x,i)=>{if(i%stepX===0||i===xs.length-1)g.fillText(x.slice(8,10)+'/'+x.slice(5,7),X(x),H-8)});
  if(opts.hline!=null){g.setLineDash([5,4]);g.strokeStyle='#c8643a';g.beginPath();g.moveTo(L,Y(opts.hline));g.lineTo(W-Rr,Y(opts.hline));g.stroke();g.setLineDash([]);g.fillStyle='#c8643a';g.textAlign='right';g.fillText(opts.hlabel||'',W-Rr,Y(opts.hline)-5)}
  let lx=L;g.textAlign='left';
  for(const s of series){g.strokeStyle=s.col;g.fillStyle=s.col;g.lineWidth=2;if(s.dash)g.setLineDash([4,3]);g.beginPath();s.pts.forEach((p,i)=>{i?g.lineTo(X(p.x),Y(p.y)):g.moveTo(X(p.x),Y(p.y))});g.stroke();g.setLineDash([]);
    if(!s.dash)for(const p of s.pts){g.beginPath();g.arc(X(p.x),Y(p.y),3,0,7);g.fill()}
    if(series.length>1){g.fillRect(lx,6,10,3);g.fillStyle='#1f2a24';g.fillText(s.name,lx+14,12);lx+=g.measureText(s.name).width+34}}
}
function drawCharts(){const u=U(),fb=FB();
  const w=[...u.weights].sort((a,b)=>a.d<b.d?-1:1).map(x=>({x:x.d,y:x.w}));
  lineChart($('#chW'),[{name:'Weight',col:'#2f6b4f',pts:w}],{dec:true,hline:w.length?u.goalWeight:null,hlabel:'goal '+u.goalWeight+' kg',empty:'Log a weight above to start the graph.'});
  const c=calc(u,S.bfFix),a=[],t=[];
  for(const d of Object.keys(u.days).sort().slice(-30)){const day=u.days[d];let tot={f:0,p:0,c:0},n=0;for(const m in day.meals){const s=sumItems(day.meals[m],fb);tot.f+=s.f;tot.p+=s.p;tot.c+=s.c;n+=day.meals[m].length}
    if(n){a.push({x:d,y:kcalOf(tot)});t.push({x:d,y:c[day.type].cal})}}
  lineChart($('#chK'),[{name:'Planned',col:'#3b6ea5',pts:a},{name:'Target',col:'#c8643a',pts:t,dash:true}],{empty:'Plan a day in the Meal planner to see it here.'});
}
/* ---------- Backup ---------- */
function vData(){return `<div class="card"><h2>Backup</h2><p class="mut">Everything is stored inside this browser on this Mac, with nothing sent anywhere. Export a backup file regularly, and use it to move the data to another Mac or browser.</p>
  <div class="row"><button class="pri" id="exp">Export backup file</button><button id="impBtn">Import backup file…</button><input type="file" id="imp" accept=".json,application/json,text/plain,*/*" style="display:none"></div></div>
  <div class="card"><h2>Reset</h2><p class="mut">Deletes all people, plans and food edits and restores the original food list.</p><button id="reset">Reset everything</button></div>`}

/* ---------- Events ---------- */
// A value typed into a field is saved when the field loses focus, which redraws the page. If that happens because a button
// was pressed, the press would be lost with the old button, so it is remembered here and replayed on the redrawn button.
document.addEventListener('mousedown',e=>{const b=e.target.closest&&e.target.closest('button');downBtn=b?{id:b.id,ds:Object.assign({},b.dataset)}:null},true);
function replayClick(){const d=downBtn;downBtn=null;if(!d)return;setTimeout(()=>{let sel='button';if(d.id)sel+='#'+CSS.escape(d.id);for(const k in d.ds)sel+='[data-'+k.replace(/[A-Z]/g,c=>'-'+c.toLowerCase())+'="'+CSS.escape(d.ds[k])+'"]';
  if(sel==='button')return;const b=document.querySelector(sel);if(b&&!b.disabled)b.click()},0)}
document.addEventListener('click',e=>{downBtn=null;const t=e.target.closest('button');if(!t)return;const ds=t.dataset;let u=U();
  if(ds.tab){tab=ds.tab}
  else if(t.id==='addUser'){const name=prompt('Name of the new person');if(!name)return;const nu=newUser(name.trim());fixUser(nu);S.users.push(nu);S.cur=nu.id;tab='profile'}
  else if(t.id==='delUser'){if(!confirm('Delete '+u.name+' and all their data?'))return;S.users=S.users.filter(x=>x.id!==u.id);S.cur=S.users[0].id}
  else if(ds.shift){planDate=shiftD(planDate,+ds.shift)}
  else if(t.id==='goToday'){planDate=today()}
  else if(ds.type){const d=getDay(true);if(d.type!==ds.type){d.type=ds.type;for(const k of Object.keys(d.carried)){const c=carryMeal(k,d.type);if(c){d.meals[k]=c.items;d.carried[k]=c.from}}}}
  else if(ds.recipe){rc=rc.key===ds.recipe?{key:null,online:null}:{key:ds.recipe,online:null};render();return}
  else if(ds.rclose){rc={key:null,online:null};render();return}
  else if(ds.ronline){recipesOnline(ds.ronline);return}
  else if(ds.rmeal){recipeDetail(ds.rmeal);return}
  else if(ds.rback){if(rc.online)delete rc.online.detail;render();return}
  else if(ds.srm){const d=getDay(true);daySupps(d,true).splice(+ds.srm,1)}
  else if(t.id==='suppReset'){delete getDay(true).supps}
  else if(t.id==='spAdd'){const name=$('#spNew').value.trim();if(!name){alert('Give the supplement a name.');return}u.supps.push({id:uid('s'),name,w:{},r:{}})}
  else if(ds.spdel){const sp=u.supps.find(x=>x.id===ds.spdel);if(!confirm('Delete "'+sp.name+'" from the usual plan? Days already logged keep it.'))return;
    for(const k in u.days)for(const x of u.days[k].supps||[])if(x.sid===sp.id)x.name=sp.name;u.supps=u.supps.filter(x=>x.id!==ds.spdel)}
  else if(ds.xadd){addExtra(getDay(true),ds.xadd)}
  else if(ds.xdel){const d=getDay(true);d.extras=(d.extras||[]).filter(x=>x.key!==ds.xdel);delete d.meals[ds.xdel]}
  else if(ds.fill){const o=(window._fills||[])[+ds.fill];if(!o)return;const d=getDay(true);let after='B';for(const [k] of MEALS)if((d.meals[k]||[]).length)after=k;
    const key=addExtra(d,after,'Snack',o.items.map(it=>({id:it.id,g:it.g})));ensureCond(d,key)}
  else if(ds.gen){genMeal(ds.gen)}
  else if(ds.fit){fitMeal(ds.fit)}
  else if(t.id==='genDay'){genDay()}
  else if(t.id==='clearDay'){const d=getDay(false);const nd={type:d.type,meals:{},carried:{},extras:[],times:{}};if(Array.isArray(d.supps))nd.supps=d.supps;u.days[planDate]=nd}
  else if(ds.lock){const [k,i]=ds.lock.split(':');const d=getDay(true);const it=d.meals[k][+i];if(it.lock)delete it.lock;else{it.lock=1;delete it.auto}touch(d,k)}
  else if(ds.rm){const [k,i]=ds.rm.split(':');const d=getDay(true);touch(d,k);const it=d.meals[k][+i];if(it&&it.auto)u.rejects[it.id]=(u.rejects[it.id]||0)+1;if(it&&it.cond){d.noCond=d.noCond||{};(d.noCond[k]=d.noCond[k]||{})[it.id]=1}d.meals[k].splice(+i,1)}
  else if(ds.pref){const [id,v]=ds.pref.split(':');u.prefs[id]=(u.prefs[id]||0)===+v?0:+v}
  else if(t.id==='nfLook'){lookupFood(nf.name);return}
  else if(ds.use){const r=lk.results[+ds.use];if(!r)return;const title=x=>x.toLowerCase().replace(/(^|[\s(\-])\S/g,c=>c.toUpperCase());
    nf.name=r.name.toUpperCase();nf.brand=r.brand?(r.src==='USDA'?title(r.brand):r.brand):'';nf.f=r.f==null?'':r.f;nf.p=r.p==null?'':r.p;nf.c=r.c==null?'':r.c;render();return}
  else if(t.id==='nfAdd'){const name=String(nf.name).trim();if(!name){alert('Give the food a name.');return}
    const brand=String(nf.brand).trim();if(S.foods.some(f=>label(f).toLowerCase()===label({name,brand}).toLowerCase())){alert('This food is already in the database.');return}
    const f=+nf.f||0,p=+nf.p||0,c=+nf.c||0;if(f+p+c>100.5){alert('Fat + protein + carbs cannot exceed 100 g per 100 g.');return}
    if(f+p+c===0&&!confirm('All three values are zero. Add anyway?'))return;
    const fd={id:uid('f'),name:name.toUpperCase(),brand,cat:(String(nf.cat).trim()||'OTHER').toUpperCase(),f,p,c};const us=+nf.usual;if(us>0)fd.usual=us;const pc=+nf.pcw;if(pc>0){fd.unit='1 piece';fd.unitW=pc+' g'}S.foods.push(fd);foodQ=name;
    nf={name:'',brand:'',cat:'',f:'',p:'',c:'',usual:'',pcw:''};lk={status:'idle',results:[],msg:''}}
  else if(ds.fdel){const fd=S.foods.find(f=>f.id===ds.fdel);if(!confirm('Delete "'+label(fd)+'"? Days that use it will drop it.'))return;S.foods=S.foods.filter(f=>f.id!==ds.fdel)}
  else if(t.id==='wAdd'){const d=parseD($('#wDate').value),w=+$('#wVal').value;if(!d){alert('Enter the date as dd/mm/yy, for example '+fmtD(today())+'.');return}if(!(w>0)){alert('Enter a weight.');return}const bf=$('#wBf').value===''?null:+$('#wBf').value;
    u.weights=u.weights.filter(x=>x.d!==d);u.weights.push({d,w,bf});const last=[...u.weights].sort((a,b)=>a.d<b.d?1:-1)[0];u.weight=last.w;if(last.bf!=null)u.bf=last.bf}
  else if(ds.wdel){u.weights=u.weights.filter(x=>x.d!==ds.wdel)}
  else if(t.id==='exp'){save();const txt=localStorage.getItem(KEY)||JSON.stringify(S),name='diet-planner-backup-'+today()+'.json';
    const dl=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([txt],{type:'application/json'}));a.download=name;document.body.appendChild(a);a.click();a.remove()};
    try{const f=new File([txt],name,{type:'application/json'});if(matchMedia('(pointer:coarse)').matches&&navigator.canShare&&navigator.canShare({files:[f]})){navigator.share({files:[f],title:'Diet Planner backup'}).catch(e=>{if(e&&e.name!=='AbortError')dl()});return}}catch(e){}
    dl();return}
  else if(t.id==='impBtn'){$('#imp').click();return}

document.addEventListener('change',e=>{const t=e.target,ds=t.dataset,u=U();
  if(t.id==='userSel'){S.cur=t.value}
  else if(ds.u){const k=ds.u;u[k]=(t.type==='number')?(+t.value||0):t.value}
  else if(t.id==='bfFix'){S.bfFix=t.checked}
  else if(t.id==='autoCond'){S.autoCond=t.checked}
  else if(t.id==='usdaKey'){S.usdaKey=t.value.trim();save();return}
  else if(ds.nf){return}
  else if(t.id==='planDate'){const d=parseD(t.value);if(d)planDate=d;else alert('Enter the date as dd/mm/yy, for example '+fmtD(today())+'.')}
  else if(t.id==='foodCat'){foodCat=t.value;render();return}
  else if(ds.g){const [k,i]=ds.g.split(':');const d=getDay(true);touch(d,k);const v=Math.max(0,+t.value||0);const it=d.meals[k][+i];if(v===0)d.meals[k].splice(+i,1);else{if(it.u){it.n=v;it.g=Math.max(1,Math.round(v*unitG(FB()[it.id],it.u)))}else it.g=v;delete it.auto}}
  else if(ds.sdone){daySupps(getDay(true),true)[+ds.sdone].done=t.checked}
  else if(ds.sdose){daySupps(getDay(true),true)[+ds.sdose].dose=t.value.trim()}
  else if(ds.swhen){daySupps(getDay(true),true)[+ds.swhen].when=t.value}
  else if(ds.stime){daySupps(getDay(true),true)[+ds.stime].time=t.value}
  else if(t.id==='suppAdd'){if(!t.value)return;let sid=t.value;
    if(sid==='__new'){const name=(prompt('Name of the new supplement')||'').trim();if(!name){render();return}const sp={id:uid('s'),name,w:{},r:{}};u.supps.push(sp);sid=sp.id}
    const sp=u.supps.find(x=>x.id===sid),d=getDay(true),pl=(d.type==='rest'?sp.r:sp.w)||{},w0=Object.keys(pl)[0];
    daySupps(d,true).push({sid,dose:w0?pl[w0]:'',when:w0||'day',time:''})}
  else if(ds.sp){const [id,g,w]=ds.sp.split(':');const sp=u.supps.find(x=>x.id===id);sp[g]=sp[g]||{};const v=t.value.trim();if(v)sp[g][w]=v;else delete sp[g][w]}
  else if(ds.spname){const sp=u.supps.find(x=>x.id===ds.spname);if(t.value.trim())sp.name=t.value.trim()}
  else if(ds.xname){const x=(getDay(true).extras||[]).find(x=>x.key===ds.xname);if(x)x.name=t.value}
  else if(ds.xtime){const x=(getDay(true).extras||[]).find(x=>x.key===ds.xtime);if(x)x.time=t.value}
  else if(ds.mtime){const d=getDay(true);d.times=d.times||{};d.times[ds.mtime]=t.value}
  else if(ds.un){const [k,i]=ds.un.split(':');const d=getDay(true);touch(d,k);const it=d.meals[k][+i];if(t.value==='g'){delete it.u;delete it.n}else{it.u=t.value;snapUnit(it,FB()[it.id])}delete it.auto}
  else if(ds.add){const tv=t.value.trim().toLowerCase();const fd=S.foods.find(f=>label(f).toLowerCase()===tv)||S.foods.find(f=>f.name.toLowerCase()===tv);if(!fd){const q=t.value.trim();if(!q)return;if(confirm('"'+q+'" is not in the food database. Look it up online and add it?')){tab='foods';nf={name:q,brand:'',cat:'',f:'',p:'',c:'',usual:'',pcw:''};render();lookupFood(q)}else t.value='';return}
    const d=getDay(true);if((d.meals[ds.add]||[]).some(it=>it.id===fd.id)){t.value='';return}touch(d,ds.add);const ni={id:fd.id,g:fd.usual||100},pw=unitG(fd,'pc');if(pw){ni.u='pc';ni.n=Math.max(1,Math.round((fd.usual||pw)/pw));ni.g=Math.round(ni.n*pw)}(d.meals[ds.add]=d.meals[ds.add]||[]).push(ni);ensureCond(d,ds.add)}
  else if(ds.fe){const [id,k]=ds.fe.split(':');const fd=S.foods.find(f=>f.id===id);const v=+t.value;if(k==='usual'){if(v>0)fd.usual=v;else delete fd.usual}else if(k==='pcw'){if(v>0){fd.unitW=v+' g';if(!fd.unit)fd.unit='1 piece'}else{fd.unitW='';fd.unit=''}}else if(k==='pcl'){const l=t.value.trim().replace(/^1\s*/,'');fd.unit=l?'1 '+l:(fd.unitW?'1 piece':'')}else fd[k]=Math.max(0,v||0)}
  else if(ds.fpref){u.prefs[ds.fpref]=+t.value}
  else if(t.id==='imp'){const f=t.files[0];if(!f)return;const rd=new FileReader();rd.onload=()=>{try{const o=JSON.parse(rd.result);if(!o.users||!o.foods)throw 0;S=o;migrate();for(const x of S.users)fixUser(x);save();render()}catch(err){alert('That file is not a Diet Planner backup.')}};rd.readAsText(f);return}
  else return;
  save();render();replayClick()});
